name: Release

# Crea mb-getterms.zip e lo allega alla release.
# Parte UNA sola volta, quando si pubblica una release dal sito di GitHub
# (Releases > Draft a new release > tag vX.Y.Z > Publish release).
# Si può anche rilanciare a mano da Actions > Release > Run workflow
# indicando il tag (utile per rigenerare lo zip di una release esistente).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release da (ri)generare, es. v1.0.1'
        required: true

permissions:
  contents: write

# Mai due build contemporanee sulla stessa release.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Controlla che la versione nel plugin corrisponda al tag
        run: |
          V="${TAG#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' mb-getterms.php | awk '{print $NF}')
          CONST=$(grep -m1 "MB_GT_VERSION'" mb-getterms.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          echo "tag=$V header=$HEADER const=$CONST"
          if [ "$V" != "$HEADER" ] || [ "$V" != "$CONST" ]; then
            echo "::error::Versione non allineata: tag $V, header $HEADER, costante $CONST"
            exit 1
          fi

      - name: Crea mb-getterms.zip
        run: |
          mkdir -p build/mb-getterms
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' --exclude='.gitignore' --exclude='.DS_Store' --exclude='README.md' ./ build/mb-getterms/
          cd build && zip -rq mb-getterms.zip mb-getterms
          unzip -l mb-getterms.zip | tail -3

      - name: Allega lo zip alla release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: build/mb-getterms.zip
          overwrite_files: true
          fail_on_unmatched_files: true
